<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0B0B0B"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1C1C1C" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1C1C1C" stroke-width="1"/>
  <!-- Arc decorations -->
  <circle cx="600" cy="630" r="200" fill="none" stroke="#1C1C1C" stroke-width="1"/>
  <circle cx="600" cy="630" r="320" fill="none" stroke="#1C1C1C" stroke-width="1"/>
  <circle cx="600" cy="630" r="440" fill="none" stroke="#161616" stroke-width="1"/>
  <!-- Lime accent dot -->
  <circle cx="600" cy="430" r="5" fill="#7CFF00" opacity="0.9"/>
  <circle cx="600" cy="430" r="10" fill="#7CFF00" opacity="0.15"/>
  <!-- Site name -->
  <text x="600" y="268" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="600" fill="#444" text-anchor="middle" letter-spacing="4">UXINTOAX.COM</text>
  <!-- Main wordmark -->
  <text x="600" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">uxintoax</text>
  <!-- Tagline -->
  <text x="600" y="398" font-family="'Open Sans', Arial, sans-serif" font-size="20" fill="#555" text-anchor="middle" letter-spacing="1">From UX to AX — Design for the Agentic Era</text>
  <!-- Bottom lime bar -->
  <rect x="520" y="420" width="160" height="2" fill="#7CFF00" rx="1"/>
</svg>
